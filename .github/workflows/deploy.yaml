name: Build and Deploy to EKS

on:
  push:
    branches: [main]
    paths:
      - 'run.py'
      - 'feedback/**'
      - 'requirements.txt'
      - 'Dockerfile'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: feedback-app
  EKS_CLUSTER_NAME: feedbackform-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Note: build context is "." (project root), not "./app" like the to-do project,
      # since this repo's Dockerfile sits at the root alongside run.py and feedback/
      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION

      - name: Deploy new image to EKS
        run: |
          kubectl set image deployment/feedback-app feedback-app=${{ steps.build-image.outputs.image }}
          kubectl rollout status deployment/feedback-app

      - name: Show application URL
        run: |
          echo "App is live at:"
          kubectl get service feedback-app-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo ""